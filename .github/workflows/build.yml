name: Build DLL

on: [workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Compile DLL
      run: |
        cl.exe /LD dllmain.cpp /Fe:automation_core.dll user32.lib gdi32.lib /EHsc

    - name: Upload DLL
      uses: actions/upload-artifact@v4
      with:
        name: compiled-dll
        path: automation_core.dll
